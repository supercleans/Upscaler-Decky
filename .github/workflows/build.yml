name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check and build
        run: |
          pnpm typecheck
          pnpm build
          pnpm test:frontend
          pnpm audit --audit-level=low
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/package.py
          mkdir -p release
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          cp "../Upscaler-Decky-$version.zip" release/
          cp "../Upscaler-Decky-$version.zip.sha256" release/SHA256SUMS
      - name: Save code-only plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Upscaler-Decky
          path: |
            release/Upscaler-Decky-*.zip
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package.json version v$version" >&2
            exit 1
          fi
          prerelease_flag=""
          case "$version" in
            0.*) prerelease_flag="--prerelease" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "release/Upscaler-Decky-$version.zip" "release/SHA256SUMS" --clobber
          else
            gh release create "$tag" "release/Upscaler-Decky-$version.zip" "release/SHA256SUMS" \
              --title "Upscaler Decky $tag" \
              --generate-notes \
              $prerelease_flag
          fi
